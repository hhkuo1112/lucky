<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>榮光煥發抽獎趣</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Inter:wght@100..900&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#F9F1D8',
                            300: '#E6C986',
                            400: '#D4AF37',
                            500: '#C5A028',
                            600: '#B08D1A',
                        },
                        charcoal: {
                            800: '#2D2D2D',
                            900: '#1A1A1A',
                            950: '#0F0F0F'
                        }
                    },
                    fontFamily: {
                        display: ['Cinzel', 'serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'breathe': 'breathe 3s ease-in-out infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                        'blur-motion': 'blurMotion 0.1s infinite',
                        'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        breathe: {
                            '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 10px rgba(212, 175, 55, 0.3)' },
                            '50%': { transform: 'scale(1.05)', boxShadow: '0 0 25px rgba(212, 175, 55, 0.6)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% center' },
                            '100%': { backgroundPosition: '200% center' },
                        },
                        blurMotion: {
                            '0%': { filter: 'blur(0px)', transform: 'translateY(0)' },
                            '50%': { filter: 'blur(2px)', transform: 'translateY(-2px)' },
                            '100%': { filter: 'blur(0px)', transform: 'translateY(2px)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.5)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at center, #2D2D2D 0%, #0F0F0F 100%);
            color: #F9F1D8;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1A1A1A;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #D4AF37;
        }

        .glass-panel {
            background: rgba(45, 45, 45, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .gold-gradient-text {
            background: linear-gradient(to right, #F9F1D8, #D4AF37, #F9F1D8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shimmer 5s linear infinite;
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #B08D1A 100%);
            color: #0F0F0F;
            border: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .btn-gold:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #D4AF37;
            color: #D4AF37;
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1);
            color: #F9F1D8;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .winner-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.95) 0%, rgba(40, 40, 40, 0.95) 100%);
            border: 2px solid #D4AF37;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.5);
        }

        #drop-zone.dragover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #D4AF37;
            transform: scale(1.02);
        }

        @keyframes shine {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .winner-grid-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .winner-grid-card.active {
            background: #D4AF37;
            color: #000;
            border-color: #F9F1D8;
            box-shadow: 0 0 15px #D4AF37;
            transform: scale(1.05);
        }

        @keyframes soft-pulse {

            0%,
            100% {
                opacity: 1;
                filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.5));
            }

            50% {
                opacity: 0.8;
                filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8));
            }
        }

        .animate-soft-pulse {
            animation: soft-pulse 2s ease-in-out infinite;
        }
    </style>

</head>

<body class="min-h-screen w-full flex flex-col items-center p-4 relative user-select-none overflow-x-hidden">
    <!-- Navbar / Header -->

    <script>const app = {
            state: {
                candidates: [],
                winners: [],
                prizes: [],
                currentPrizeId: null,
                isDrawing: false
            }

            ,

            fileHandle: null,

            init() {
                this.loadState();
                this.state.isDrawing = false;

                // Version check: Clear old English data if present (simple check)
                // If user has 'Grand Cash Prize' in prizes, it's likely the old version
                const isOldData = this.state.prizes.some(p => p.name === "Grand Cash Prize");

                if (isOldData) {
                    this.state.prizes = [];
                    // Keep candidates if they look custom, but reset winners to be safe?
                    // Let's just reset prizes and let candidates stay if they were uploaded.
                    this.saveState();
                }

                // Start with empty prizes if none exist
                if (this.state.prizes.length === 0) {
                    this.state.prizes = []; // No default mock data
                    this.saveState();
                }

                this.updateUI();
                this.setupEventListeners();
                this.renderPrizes();

                if (this.state.currentPrizeId) {
                    this.resetRollerDisplay(this.state.currentPrizeId);
                } else {
                    this.resetRollerDisplay();
                }
            }

            ,

            loadState() {
                const saved = localStorage.getItem('luckyDrawState');

                if (saved) {
                    this.state = {
                        ...this.state,
                        ...JSON.parse(saved)
                    }

                        ;
                }
            }

            ,

            saveState() {
                localStorage.setItem('luckyDrawState', JSON.stringify(this.state));
                this.updateUI();
            }

            ,

            setupEventListeners() {
                // Click outside to close panels
                document.addEventListener('click', (e) => {
                    const panels = ['panel-history', 'panel-prizes', 'panel-candidates'];
                    const mainStage = document.querySelector('main');
                    const header = document.querySelector('header');

                    if (mainStage && mainStage.contains(e.target)) {
                        panels.forEach(id => {
                            const el = document.getElementById(id);
                            if (el && !el.classList.contains('translate-x-full')) {
                                el.classList.add('translate-x-full');
                            }
                        });
                    }
                });
            }

            parseCandidatesCSVText(text) {
                if (!text) return alert("檔案內容為空");
                const lines = text.split(/\r\n|\n/);
                const newCandidates = [];

                lines.forEach(line => {
                    const parts = line.split(/,|，|\t/); // Comma, Chinese comma, Tab
                    if (parts.length >= 3) {
                        const name = parts[0].trim();
                        if (!name || name === "姓名" || name === "Name") return;
                        const empId = parts[1].trim();
                        const dept = parts[2].trim();
                        if (name && dept && empId) {
                            newCandidates.push({
                                name,
                                dept,
                                empId,
                                id: Math.random().toString(36).substr(2, 9)
                            });
                        }
                    }
                });

                if (newCandidates.length > 0) {
                    this.mergeCandidates(newCandidates);
                } else {
                    alert("無法解析 CSV 資料，請檢查格式 (姓名,員工證號,部門 皆為必填)。");
                }
            }

            ,

            processData(data) {
                // Heuristic column detection
                const newCandidates = data.map(row => {
                    const keys = Object.keys(row);
                    const nameKey = keys.find(k => k.toLowerCase().includes('name') || k.includes('姓名')) || keys[0];
                    const deptKey = keys.find(k => k.toLowerCase().includes('dept') || k.includes('部門') || k.toLowerCase().includes('department')) || keys[1];
                    const empIdKey = keys.find(k => k.toLowerCase().includes('id') || k.includes('員工證') || k.includes('證號') || k.includes('編號')) || keys[2];

                    if (!row[nameKey] || !row[deptKey] || !row[empIdKey]) return null;

                    return {
                        name: String(row[nameKey]).trim(),
                        dept: String(row[deptKey]).trim(),
                        empId: String(row[empIdKey]).trim(),
                        id: Math.random().toString(36).substr(2, 9)
                    };
                }).filter(x => x);

                if (newCandidates.length > 0) {
                    this.mergeCandidates(newCandidates);
                } else {
                    alert("檔案中找不到有效資料 (姓名, 部門, 員工證號 皆為必填)。");
                }
            },

            mergeCandidates(newCandidates) {
                let addedCount = 0;
                let duplicateCount = 0;

                newCandidates.forEach(newItem => {
                    const exists = this.state.candidates.some(
                        curr => curr.name === newItem.name && curr.empId === newItem.empId
                    );

                    // Also check if already won to be safe? (Optional, usually we allow re-import but filter at draw time. 
                    // But here let's strictly check candidates list)

                    if (!exists) {
                        this.state.candidates.push(newItem);
                        addedCount++;
                    } else {
                        duplicateCount++;
                    }
                });

                if (addedCount > 0) {
                    this.saveState();
                    this.renderCandidatesList();
                    alert(`成功匯入 ${addedCount} 位參加者！\n(忽略 ${duplicateCount} 筆重複資料)`);
                } else {
                    alert(`未匯入任何新資料。\n所有 ${duplicateCount} 筆資料皆已存在。`);
                }
            },

            addPrize() {
                const nameInput = document.getElementById('new-prize-name');
                const sponsorInput = document.getElementById('new-prize-sponsor');

                const name = nameInput.value.trim();

                if (name && qty > 0) {
                    const existingPrize = this.state.prizes.find(p => p.name === name && p.sponsor === sponsor);

                    if (existingPrize) {
                        // 若已存在，則直接呼叫加碼邏輯
                        app.setPrizeQty(existingPrize.id, qty, true);
                    } else {
                        const newPrize = {
                            id: Date.now(),
                            name,
                            sponsor,
                            qty,
                            remaining: qty
                        };
                        // 新獎項放到陣列最上面
                        this.state.prizes.unshift(newPrize);

                        if (!this.state.currentPrizeId) {
                            this.selectPrizeForDraw(newPrize.id);
                        } else {
                            this.saveState();

            deletePrize(id) {
                if (!confirm("確定刪除此獎項？")) return;

                // If current, reset display
                if (this.state.currentPrizeId == id) {
                    this.state.currentPrizeId = null;
                    document.getElementById('display-prize-name').textContent = "準備抽獎";
                }

                this.state.prizes = this.state.prizes.filter(p => p.id != id);

                // Select another if available
                const validPrizes = this.state.prizes.filter(p => p.remaining > 0);
                if (!this.state.currentPrizeId && validPrizes.length > 0) {
                    this.selectPrizeForDraw(validPrizes[0].id);
                } else {
                    this.saveState();
                    this.renderPrizes();
                    this.updateUI();
                }

            clearPrizes() {
                if (confirm('確定清空所有獎項？')) {
                    if (confirm('此動作無法復原，確定要清空嗎？')) {
                        this.state.prizes = [];
                        this.state.currentPrizeId = null;

                        this.renderPrizes();
                        this.updateUI();
                        this.resetRollerDisplay(null);
                    }
                }

            setPrizeQty(id, newQtyStr, isAddMode = false) {
                const prize = this.state.prizes.find(p => p.id == id);
                if (!prize) return;

                let newQty = parseInt(newQtyStr);

                if (isAddMode) {
                    // isAddMode means it was exhausted and the user is adding new qty
                    if (isNaN(newQty) || newQty <= 0) {
                        this.renderPrizes(); // reset input visually
                        return;
                    }

                    prize.qty += newQty;
                    prize.remaining += newQty;

                    // 將加碼恢復的獎項移到「最上面（陣列第一個）」並自動選中
                    this.state.prizes = this.state.prizes.filter(p => p.id != id);
                    this.state.prizes.unshift(prize);
                    this.state.currentPrizeId = id;
                    this.resetRollerDisplay(id);

                    this.saveState();
                    this.renderPrizes();
                    this.updateUI();

                    // Scroll to the newly activated prize item with a small delay to ensure DOM is ready
                    setTimeout(() => {
                        const el = document.getElementById(`prize-item-${id}`);
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            el.classList.add('ring-4', 'ring-gold-400', 'ring-opacity-50');
                            setTimeout(() => el.classList.remove('ring-4', 'ring-gold-400', 'ring-opacity-50'), 1500);

                            const inp = el.querySelector('input');
                            if (inp) inp.focus();
                        }
                    }, 150);
                    return;
                }

                if (isNaN(newQty) || newQty < 1) newQty = 1;

                const diff = newQty - prize.remaining;
                prize.qty += diff;
                prize.remaining = newQty;

                this.saveState();
                this.renderPrizes();
                this.updateUI();
            },

            parseCandidatesCSV(inputId = 'csv-input-candidates-panel') {
                const text = document.getElementById(inputId).value.trim();
                if (!text) return alert("請輸入內容");
                this.parseCandidatesCSVText(text);
            },
            parsePrizesCSV(inputId = 'csv-input-prizes') {
                const text = document.getElementById(inputId).value.trim();
                if (!text) return alert("請輸入內容");

                const lines = text.split('\n');
                const newPrizes = [];

                lines.forEach(line => {
                    if (!line.trim()) return;
                    const parts = line.split(/,|，|\t/);
                    if (parts.length >= 1) {
                        const name = parts[0].trim();
                        if (name === "獎項" || name === "Prize") return; // Header

                        let qty = 1;
                        if (parts.length > 1) {
                            const q = parseInt(parts[1].trim());
                            if (!isNaN(q) && q > 0) qty = q;
                        }

                        // Optional Sponsor Column
                        let sponsor = "";
                        if (parts.length > 2) {
                            sponsor = parts[2].trim();
                        }

                        if (name) {
                            newPrizes.push({
                                id: Date.now() + Math.random(),
                                name,
                                sponsor,
                                qty,
                                remaining: qty
                            });
                        }
                    }
                });

                if (newPrizes.length > 0) {
                    if (confirm(`確定要匯入 ${newPrizes.length} 個獎項嗎？`)) {
                        [...newPrizes].reverse().forEach(np => {
                            const existingPrize = this.state.prizes.find(p => p.name === np.name && p.sponsor === np.sponsor);
                            if (existingPrize) {
                                // 將剩餘與總數合併
                                existingPrize.qty += np.qty;
                                existingPrize.remaining += np.remaining;
                                // 移到最上方
                                this.state.prizes = this.state.prizes.filter(p => p.id != existingPrize.id);
                                this.state.prizes.unshift(existingPrize);
                            } else {
                                this.state.prizes.unshift(np);
                            }
                        });

                        this.saveState();
                        this.renderPrizes();
                        this.updateUI();
                        // 確保至少有選中一個
                        if (!this.state.currentPrizeId || !this.state.prizes.find(p => p.id == this.state.currentPrizeId && p.remaining > 0)) {
                            const validPrizes = this.state.prizes.filter(p => p.remaining > 0);
                            if (validPrizes.length > 0) {
                                this.selectPrizeForDraw(validPrizes[0].id);
                            } else {
                                this.resetRollerDisplay(null);
                            }
                        } else {
                            this.resetRollerDisplay(this.state.currentPrizeId);
                        }

                        document.getElementById(inputId).value = '';
                    }
                } else {
                    alert("無法解析資料。格式：獎項名稱, 數量");
                }
            },

            selectPrizeForDraw(id) {
                const prize = this.state.prizes.find(p => p.id == id);
                if (prize && prize.remaining <= 0) return; // Disallow selecting exhausted

                this.state.currentPrizeId = id;
                this.saveState();
                this.renderPrizes();
                this.updateUI(); // Updates buttons
                this.resetRollerDisplay(id); // Reset screen to "Ready"
            },

            resetRollerDisplay(prizeId) {
                const prize = this.state.prizes.find(p => p.id == prizeId);
                const container = document.getElementById('roller-container');
                const display = document.getElementById('current-prize-display');

                // Show prize title
                const displayName = document.getElementById('display-prize-name');
                const displaySponsor = document.getElementById('display-sponsor');
                const sponsorName = document.getElementById('sponsor-name');
                const displayQty = document.getElementById('display-prize-qty');

                if (prize) {
                    displayName.textContent = prize.name;
                    displayQty.textContent = `x ${prize.remaining}`;

                    // Toggle Sponsor
                    if (prize.sponsor) {
                        sponsorName.textContent = prize.sponsor;
                        displaySponsor.classList.remove('hidden');
                    } else {
                        displaySponsor.classList.add('hidden');
                    }

                    display.classList.remove('opacity-0');
                    display.classList.add('animate-pop-in');
                } else {
                    // Empty state / Ready state
                    displayName.textContent = "準備抽獎";
                    displayQty.textContent = "";
                    displaySponsor.classList.add('hidden');
                    display.classList.remove('opacity-0');
                }

                // Determine slots to show (based on remaining or specific request)
                // We show placeholders for ALL remaining winners of this prize
                const slots = prize ? prize.remaining : 0;

                if (!prize || slots === 0) {
                    // Reset to initial generic state
                    container.innerHTML = `
                        <div id="roller-dept" class="text-gold-300 text-xl md:text-2xl font-light tracking-widest mb-4 uppercase">準備中</div>
                        <div id="roller-name" class="text-5xl md:text-7xl font-display font-bold text-white drop-shadow-2xl">等候開始</div>
                     `;
                    return;
                }

                // Flex View - Better centering and responsiveness
                let cardClass = 'w-48 h-48'; // Default Square
                let nameSize = 'text-2xl md:text-3xl';

                // If 5 or fewer, let them take up proportional space but not exceed a certain max width to keep them nice
                // using flex layout
                if (slots <= 5) {
                    cardClass = 'flex-1 min-w-[200px] max-w-[300px] aspect-square'; // Grow equally, wrap if needed
                    nameSize = 'text-4xl md:text-5xl';
                } else if (slots <= 10) {
                    cardClass = 'w-36 h-36 md:w-48 md:h-48';
                    nameSize = 'text-xl md:text-2xl';
                } else if (slots <= 15) {
                    cardClass = 'w-28 h-24 md:w-36 md:h-28';
                    nameSize = 'text-lg md:text-xl';
                } else {
                    cardClass = 'w-24 h-20 md:w-28 md:h-24';
                    nameSize = 'text-sm md:text-base';
                }

                // A max of 5 per row naturally happens if container max-w allows, or we force it with flex-basis logic
                // The easiest is flex with wrap and center, and card constraints.

                let html = `<div class="flex flex-wrap justify-center items-center gap-4 w-full px-4 overflow-y-auto max-h-[60vh] custom-scrollbar py-4" style="max-width: 1400px; margin: 0 auto;">`;

                for (let i = 0; i < slots; i++) {
                    html += `
                        <div class="winner-grid-card relative group p-2 bg-gradient-to-br from-gold-400/20 to-transparent border border-gold-500/30 rounded-xl overflow-hidden flex flex-col items-center justify-center ${cardClass} transition-all duration-300 hover:scale-105 hover:bg-gold-500/10 shadow-lg" id="slot-${i}">
                            <div class="absolute inset-x-0 top-0 h-[2px] bg-gradient-to-r from-transparent via-gold-400 to-transparent opacity-50"></div>
                            <div class="text-gold-300/70 text-xs md:text-sm uppercase tracking-wider mb-2 font-light">
                                <span class="slot-dept bg-black/40 px-3 py-1 rounded-full border border-gold-500/10">準備中</span>
                            </div>
                            <div class="flex items-baseline justify-center w-full px-2">
                                <div class="slot-name text-white font-bold ${nameSize} truncate text-center drop-shadow-md tracking-wide">
                                    ???
                                </div>
                            </div>
                        </div>`;
                }

                html += `</div>`;
                container.innerHTML = html;
            }

            ,

            startDraw() {
                if (this.state.isDrawing) return;

                const panelIds = ['panel-candidates', 'panel-history', 'panel-prizes'];
                const isAnyPanelOpen = panelIds.some(id => {
                    const el = document.getElementById(id);
                    return el && !el.classList.contains('translate-x-full');
                });
                if (isAnyPanelOpen) return;

                const prize = this.state.prizes.find(p => p.id === this.state.currentPrizeId);

                // Also respect the UI disabled state
                const btn = document.getElementById('draw-btn');
                if (btn && btn.disabled) return;

                if (!prize || prize.remaining <= 0 || this.state.candidates.length === 0) {
                    return;
                }

                // Draw ALL remaining prizes at once
                const drawCount = prize.remaining; // Draw all remaining

                if (this.state.candidates.length < drawCount) {
                    alert(`錯誤：剩餘人數 (${this.state.candidates.length}) 不足${drawCount}人。`);
                    return;
                }

                this.state.isDrawing = true;
                this.updateUI();

                // Animate
                const container = document.getElementById('roller-container');
                container.classList.add('animate-blur-motion');

                let speed = 50;
                let duration = 0;
                const maxDuration = 1000;

                // Animation Loop
                const roll = () => {
                    // Grid Mode Animation
                    for (let i = 0; i < drawCount; i++) {
                        const randomIdx = Math.floor(Math.random() * this.state.candidates.length);
                        const c = this.state.candidates[randomIdx];

                        const slot = document.getElementById(`slot-${i}`);

                        if (slot) {
                            slot.querySelector('.slot-name').textContent = c.name;
                            slot.querySelector('.slot-dept').textContent = c.dept;
                        }
                    }

                    duration += speed;

                    if (duration < maxDuration) {
                        if (duration > maxDuration * 0.7) speed += 10;
                        setTimeout(roll, speed);
                    }

                    else {
                        this.finalizeBatchDraw(drawCount);
                    }
                };
                roll();
            }

            ,

            finalizeBatchDraw(count) {
                const container = document.getElementById('roller-container');
                container.classList.remove('animate-blur-motion');

                const newWinners = [];
                const prizeIndex = this.state.prizes.findIndex(p => p.id === this.state.currentPrizeId);
                const prizeName = this.state.prizes[prizeIndex].name;

                for (let i = 0; i < count; i++) {
                    // Pick unique random
                    const winIdx = Math.floor(Math.random() * this.state.candidates.length);
                    const winner = this.state.candidates[winIdx];

                    // Remove from pool
                    this.state.candidates.splice(winIdx, 1);

                    // Add to winners
                    const winRecord = {
                        ...winner,
                        prize: prizeName,
                        timestamp: new Date().toISOString()
                    }

                        ;
                    newWinners.push(winRecord);
                    this.state.winners.push(winRecord);
                    this.state.prizes[prizeIndex].remaining--;
                }

                this.saveState();

                // Grid UI
                newWinners.forEach((w, idx) => {
                    const slot = document.getElementById(`slot-${idx}`);
                    if (slot) {
                        slot.querySelector('.slot-name').textContent = w.name;
                        slot.querySelector('.slot-dept').textContent = w.dept;
                        slot.classList.add('active'); // Gold highlight
                    }
                });
                // Show overlay list
                this.showWinnerScreen(newWinners);
            }

            ,

            showWinnerScreen(winnersList) {
                const overlay = document.getElementById('winner-overlay');
                const card = document.getElementById('winner-card-inner');

                // Customize overlay based on single vs multiple
                if (winnersList.length === 1) {
                    const w = winnersList[0];

                    card.innerHTML = `
                        <h2 class="text-gold-400 text-2xl md:text-3xl uppercase tracking-[0.5em] mb-8 font-light">恭喜中獎</h2>
                        <div class="mb-8 flex flex-col items-center">
                            <span class="inline-block px-6 py-2 rounded-full bg-gold-500/20 text-gold-300 border border-gold-500/30 text-xl md:text-2xl tracking-widest uppercase mb-4">${w.dept}</span>
                            <div class="flex items-baseline justify-center whitespace-nowrap">
                                <h1 class="text-7xl md:text-[8rem] font-display font-bold text-white mb-2 drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">${w.name}</h1>
                                <span class="text-3xl md:text-5xl text-gray-400 ml-4 font-sans font-normal drop-shadow-md">(${w.empId})</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-center gap-4">
                            <div class="text-gray-400 text-sm uppercase tracking-widest">獲得獎項</div>
                            <div class="text-2xl md:text-4xl text-gold-100 font-serif italic">${w.prize}</div>
                        </div>
                        <button onclick="app.closeWinnerOverlay()" class="mt-12 btn-gold px-8 py-3 rounded-full text-lg shadow-lg hover:shadow-gold-500/50">繼續</button>
                    `;
                }

                else {
                    // Multiple List View
                    const prizeName = winnersList[0].prize;
                    let listHtml = `<div class="grid grid-cols-2 md:grid-cols-3 gap-6 max-h-[60vh] overflow-y-auto custom-scrollbar p-4">`;
                    winnersList.forEach(w => {
                        listHtml += `
                            <div class="bg-gray-800/80 p-5 rounded-xl border border-gold-500/30 shadow-lg flex flex-col items-center text-center transition-transform hover:scale-105">
                                <div class="text-base md:text-lg text-gold-300 mb-2 truncate w-full">${w.dept}</div>
                                <div class="flex items-baseline justify-center whitespace-nowrap gap-2 w-full overflow-hidden">
                                    <div class="text-3xl md:text-4xl font-bold text-white truncate">${w.name}</div>
                                    <div class="text-base md:text-lg text-gray-400 font-mono flex-shrink-0">(${w.empId})</div>
                                </div>
                            </div>
                        `;
                    });
                    listHtml += `</div>`;

                    card.innerHTML = `
                         <h2 class="text-gold-400 text-2xl md:text-3xl uppercase tracking-[0.5em] mb-4 font-light">恭喜中獎 (${winnersList.length} 位)</h2>
                         <div class="text-2xl md:text-4xl text-gold-100 font-serif italic mb-8">${prizeName}</div>
                         ${listHtml}
                         <button onclick="app.closeWinnerOverlay()" class="mt-8 btn-gold px-8 py-3 rounded-full text-lg shadow-lg hover:shadow-gold-500/50">繼續</button>
                    `;
                }

                overlay.classList.remove('hidden');
                // Trigger reflow
                void overlay.offsetWidth;
                overlay.classList.remove('opacity-0');

                // Confetti Explosion
                this.fireConfetti();

                this.state.isDrawing = false;
                this.updateUI();
            }

            ,

            async closeWinnerOverlay() {
                // 必須在點擊繼續的同步事件中觸發 File System Access API 以取得授權
                if (window.showSaveFilePicker && !this.fileHandle) {
                    try {
                        this.fileHandle = await window.showSaveFilePicker({
                            suggestedName: "幸運抽獎_中獎名單.xlsx",
                            types: [{
                                description: 'Excel Workbook',
                                accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] }
                            }]
                        });
                    } catch (e) {
                        console.log("使用者取消選擇或不支援檔案選擇器", e);
                    }
                }

                const overlay = document.getElementById('winner-overlay');
                overlay.classList.add('opacity-0');
                setTimeout(() => {
                    overlay.classList.add('hidden');

                    // Check if current prize is exhausted
                    if (this.state.currentPrizeId) {
                        const currentPrize = this.state.prizes.find(p => p.id === this.state.currentPrizeId);
                        if (currentPrize && currentPrize.remaining <= 0) {
                            // Don't delete the prize, just clear the current selection
                            this.state.currentPrizeId = null;

                            // Reset to Ready Screen with the next available prize if any
                            const nextPrize = this.state.prizes.find(p => p.remaining > 0);
                            if (nextPrize) {
                                this.state.currentPrizeId = nextPrize.id;
                                this.resetRollerDisplay(this.state.currentPrizeId);
                            } else {
                                this.resetRollerDisplay();
                            }
                            this.saveState();
                            this.renderPrizes();
                        }
                    }
                    this.state.isDrawing = false;
                    this.updateUI();

                    // 自動匯出結果到 Excel
                    this.exportWinners(true);
                }, 500);
            },

            fireConfetti() {
                var duration = 3000;
                var end = Date.now() + duration;

                (function frame() {
                    confetti({

                        particleCount: 5,
                        angle: 60,
                        spread: 55,
                        origin: {
                            x: 0
                        },
                        zIndex: 9999,
                        colors: ['#D4AF37', '#F9F1D8', '#FFFFFF']
                    });

                    confetti({

                        particleCount: 5,
                        angle: 120,
                        spread: 55,
                        origin: {
                            x: 1
                        },
                        zIndex: 9999,
                        colors: ['#D4AF37', '#F9F1D8', '#FFFFFF']
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }

                    ());
            }

            ,

            confirmReset() {
                if (confirm("您確定要重置所有資料嗎？這將會清除所有參加者、中獎紀錄與獎項設定。")) {
                    if (confirm("請再次確認？此動作無法復原。")) {
                        localStorage.removeItem('luckyDrawState');
                        location.reload();
                    }
                }
            }

            ,

            async exportWinners(isAuto = false) {
                if (this.state.winners.length === 0) {
                    if (!isAuto) alert("沒有中獎者可匯出。");
                    // 為了測試寫入授權，如果是自動且沒中獎者，也可以產生一份空的
                    if (!isAuto) return;
                }

                const wb = XLSX.utils.book_new();

                // Group winners by prize
                const groupedWinners = {};
                this.state.winners.forEach(w => {
                    if (!groupedWinners[w.prize]) {
                        groupedWinners[w.prize] = [];
                    }
                    groupedWinners[w.prize].push({
                        '姓名': w.name,
                        '員工證號': w.empId,
                        '部門': w.dept,
                        '獎項': w.prize,
                        '抽出時間': new Date(w.timestamp).toLocaleString()
                    });
                });

                // Add a sheet for each prize group
                Object.keys(groupedWinners).forEach(prizeName => {
                    const ws = XLSX.utils.json_to_sheet(groupedWinners[prizeName]);
                    // Sheet names cannot exceed 31 chars and shouldn't contain certain special chars
                    let safeSheetName = prizeName.replace(/[\\/?*\[\]:]/g, '_').substring(0, 31);
                    if (!safeSheetName) safeSheetName = "未命名獎項";
                    XLSX.utils.book_append_sheet(wb, ws, safeSheetName);
                });

                // Add a master sheet at the end
                const allFormatted = this.state.winners.map(w => ({
                    '姓名': w.name,
                    '員工證號': w.empId,
                    '部門': w.dept,
                    '獎項': w.prize,
                    '抽出時間': new Date(w.timestamp).toLocaleString()
                }));
                const allWs = XLSX.utils.json_to_sheet(allFormatted);
                XLSX.utils.book_append_sheet(wb, allWs, "全部中獎名單總表");

                // 若有授權過檔案覆寫，直接更新同一個檔案
                if (this.fileHandle) {
                    try {
                        const buffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                        const writable = await this.fileHandle.createWritable();
                        await writable.write(buffer);
                        await writable.close();
                        console.log("自動覆寫 Excel 檔案成功");
                        return; // 如果成功寫入，就不再觸發傳統下載
                    } catch (e) {
                        console.error("覆寫檔案失敗，改回使用傳統下載...", e);
                    }
                }

                // 若不支援、被拒絕或覆寫失敗，回退至傳統下載 (注意瀏覽器可能封鎖非互動腳本下載)
                XLSX.writeFile(wb, "幸運抽獎_中獎名單.xlsx");
            }

            ,

            async requestSaveAccess() {
                if (window.showSaveFilePicker) {
                    try {
                        this.fileHandle = await window.showSaveFilePicker({
                            suggestedName: "幸運抽獎_中獎名單.xlsx",
                            types: [{
                                description: 'Excel Workbook',
                                accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] }
                            }]
                        });
                        alert("✅ 存檔授權成功！\n之後抽獎結束按下繼續時，會自動覆寫同一個檔案。");

                        const btn = document.getElementById('auth-btn');
                        if (btn) btn.classList.add('hidden');

                        // 順便進行一次寫入測試，建立出實體檔案
                        await this.exportWinners(true);
                    } catch (e) {
                        console.log("使用者取消選擇或不支援檔案選擇器", e);
                    }
                } else {
                    alert("您的瀏覽器不支援自動覆寫授權功能。");
                }
            }
        }

            ;
        // 監聽鍵盤的邏輯
        window.addEventListener('keydown', (e) => {
            // 監聽 Enter 鍵（對應 ESP32 的發送指令）
            if (e.key === 'Enter') {
                if (e.repeat) return;

                // 檢查是否右側面板開啟，或者中獎畫面開啟
                const panelIds = ['panel-candidates', 'panel-history', 'panel-prizes'];
                const panelsOpen = panelIds.some(id => {
                    const el = document.getElementById(id);
                    return el && !el.classList.contains('translate-x-full');
                });
                const overlayOpen = document.getElementById('winner-overlay') && !document.getElementById('winner-overlay').classList.contains('hidden');
                const btn = document.getElementById('draw-btn');
                const isBtnDisabled = btn ? btn.disabled : false;

                if (!app.state.isDrawing && !panelsOpen && !overlayOpen && !isBtnDisabled) {
                    console.log("實體按鈕觸發！");
                    app.startDraw();
                }
            }
        });
        // Initialize App
        window.addEventListener('DOMContentLoaded', () => app.init());

        // Debug
        window.app = app;
    </script>
</body>

</html>
